version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      # react-dom exige la misma versión exacta de react como peer: en PRs
      # separadas, npm ci falla con ERESOLVE en ambas.
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      # init y analyze deben ir en la misma versión: en PRs separadas,
      # ninguna puede pasar CodeQL por sí sola.
      codeql-action:
        patterns:
          - "github/codeql-action*"
