name: Daily Job Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: read

concurrency:
  group: daily-job-radar
  cancel-in-progress: false

jobs:
  ingest:
    name: Retrieve and store job listings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pipeline image
        run: docker build -t job-radar-pipeline .

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NOTIFICATION_FROM: ${{ secrets.NOTIFICATION_FROM }}
          NOTIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured"
            exit 1
          fi

          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "RESEND_API_KEY and NOTIFICATION_EMAIL secrets are required"
            exit 1
          fi

          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_URL \
            -e RESEND_API_KEY \
            -e NOTIFICATION_EMAIL \
            -e NOTIFICATION_FROM \
            -e NOTIFICATION_RUN_ID \
            job-radar-pipeline
