name: Daily Job Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: read

concurrency:
  group: daily-job-radar
  cancel-in-progress: false

jobs:
  ingest:
    name: Retrieve and store job listings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build -t job-radar-pipeline .

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured"
            exit 1
          fi

          docker run --rm \
            -e DATABASE_URL \
            job-radar-pipeline
